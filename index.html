<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonlist Personal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Demonlist Personal</h1>
    <p>Tu progreso en Geometry Dash</p>
  </header>

  <main>
    <section class="controls">
      <input type="text" id="search" placeholder="Buscar nivel...">
      <select id="difficultyFilter">
        <option value="">Todas las dificultades</option>
        <option value="Easy Demon">Easy Demon</option>
        <option value="Medium Demon">Medium Demon</option>
        <option value="Hard Demon">Hard Demon</option>
        <option value="Insane Demon">Insane Demon</option>
        <option value="Extreme Demon">Extreme Demon</option>
      </select>
    </section>

    <table id="levelsTable">
      <thead>
        <tr>
          <th>Nivel</th>
          <th>Creador</th>
          <th>Dificultad</th>
          <th>Progreso</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <footer>
    <p>Creado por Felix — Geometry Dash</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
