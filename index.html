<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonlist Felix</title>
  <link rel="stylesheet" href="styles-new.css?v=5">
  <script src="script-new.js?v=1" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Demonlist Felix</h1>
      <p>Tu progreso en Geometry Dash con diseño sci-fi, ranking y animaciones.</p>
    </header>

    <section class="controls-section">
      <input type="text" id="buscar" placeholder="Buscar nivel..." class="input-field">
      <select id="filtro-dificultad" class="select-field">
        <option value="todas">Todas las dificultades</option>
        <option value="Extreme Demon">Extreme Demon</option>
        <option value="Insane Demon">Insane Demon</option>
        <option value="Hard Demon">Hard Demon</option>
        <option value="Medium Demon">Medium Demon</option>
        <option value="Easy Demon">Easy Demon</option>
      </select>
    </section>

    <section class="table-section">
      <table id="tabla-niveles">
        <thead>
          <tr>
            <th>Posición</th>
            <th>Nivel</th>
            <th>Creador</th>
            <th>Dificultad</th>
            <th>Progreso</th>
            <th>Jugadores</th>
            <th>Puntos</th>
          </tr>
        </thead>
        <tbody id="lista-niveles">
          </tbody>
      </table>
    </section>

    <section class="form-section">
      <h2>Añadir nivel</h2>
      <form id="form-nivel">
        <input type="text" id="nombre" placeholder="Nombre del nivel" required class="input-field">
        <input type="text" id="creador" placeholder="Creador" required class="input-field">
        
        <select id="dificultad" class="select-field" required>
          <option value="Easy Demon">Easy Demon</option>
          <option value="Medium Demon">Medium Demon</option>
          <option value="Hard Demon">Hard Demon</option>
          <option value="Insane Demon">Insane Demon</option>
          <option value="Extreme Demon">Extreme Demon</option>
        </select>
        
        <input type="number" id="progreso" placeholder="Progreso (%)" min="1" max="100" required class="input-field">
        <input type="number" id="posicion" placeholder="Posición en la lista" min="1" class="input-field">
        <input type="text" id="jugadores" placeholder="Personas que se lo han pasado (separadas por comas)" class="input-field">
        
        <button type="submit" id="btn-submit" class="btn-cyan">AÑADIR</button>
      </form>
    </section>
  </main>
</body>
</html>
